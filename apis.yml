aid: dotterel
name: Dotterel
description: >-
  Dotterel Technologies is an Auckland, New Zealand acoustics and audio-hardware
  company founded in 2015 out of the Callaghan Innovation C-Prize. It began by
  solving drone noise, building acoustic shrouds, low-noise propellers, and
  onboard active audio-recording systems for UAVs used in film, security, and
  noise mapping. That work led to Konos (now marketed as Konos Digital), an
  80-element directional MEMS microphone array with a continuously variable
  60-300 degree beam width that streams four channels of AES67 / SMPTE ST 2110
  audio over a single Power-over-Ethernet cable, targeting film, broadcast, and
  live-sports production. The microphone exposes a firmware-updatable on-device
  HTTP control interface (a web page plus a POST control endpoint for beam
  steering) rather than a public developer web API. Dotterel is backed by
  Techstars (Adelaide 2017 cohort) and is tracked here as a hardware company;
  it publishes no public API specification, SDK, or developer portal.
